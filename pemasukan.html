<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemasukan</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/button.css">
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Tambah Pemasukan</h2>
  </div>

  <div class="card">

    <label for="kategori">Kategori</label>
    <div class="inputWrapper">

      <input
        type="text"
        id="kategori"
        autocomplete="off"
        oninput="showKategori()"
        placeholder="Contoh : Kas Operasional"
      >

      <div id="kategoriDropdown"></div>

    </div>

    <label for="nominal">Nominal</label>
    <input id="nominal" type="text" inputmode="numeric" placeholder="0">

    <label for="catatan">Keterangan</label>
    <textarea id="catatan" placeholder="Catatan"></textarea>
    
    <label for="file">Upload Bukti</label>
    <input type="file" id="file" accept="image/*,.pdf">
    <img id="preview">
    
    <p id="status"></p>
    <button id="btnSimpan" onclick="simpanPemasukan()">Simpan</button>

    <button class="btnBack" >Kembali</button>

  </div>

</div>

<footer id="footer">
© 2026 Laporan Keuangan Operasional
</footer>

<!-- SCRIPT -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/pemasukan.js"></script>


</body>
</html>
